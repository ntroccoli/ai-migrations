name: Report an error
description: A wrong number or date, a broken link, a misattribution, or a summary that misreads its source.
labels: [correction]
body:
  - type: input
    id: file
    attributes:
      label: File
      description: Path or link, for example cases/2025-04-01-airbnb-enzyme-to-rtl.md
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What is wrong
      description: Quote the line and explain the problem. Link the source that shows it.
    validations:
      required: true
